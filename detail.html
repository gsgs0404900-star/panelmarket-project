<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanelMarket | Ürün Detayı</title><style>
:root{--bg:#020711;--panel:#071426;--panel2:#0a1a31;--line:#183457;--text:#eef5ff;--muted:#91a7c6;--blue:#1595ff;--purple:#8056ff;--green:#23d5a0;--orange:#ffad39}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#102d57 0,#020711 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.container{width:min(1540px,calc(100% - 42px));margin:auto}.nav{margin:18px auto 0;border:1px solid #27456f;background:rgba(5,16,34,.92);border-radius:22px;display:flex;align-items:center;gap:28px;padding:13px 24px;box-shadow:0 12px 45px #0006;position:sticky;top:12px;z-index:5;backdrop-filter:blur(16px)}.logo{font-size:27px;font-weight:900;letter-spacing:-1.4px;white-space:nowrap}.logo span{color:#42aaff}.logo i{font-style:normal;color:#fff}.navlinks{display:flex;align-items:center;gap:26px;margin-left:auto}.navlinks a{font-size:14px;color:#b8c9e3}.navlinks a.active{color:#fff;border-bottom:2px solid var(--blue);padding-bottom:17px;margin-bottom:-17px}.nav-actions{display:flex;gap:10px;align-items:center}.iconbtn,.account,.back{background:#0a1930;border:1px solid #213b60;color:#dceaff;border-radius:13px;padding:11px 14px;cursor:pointer}.page{padding:22px 0 60px}.crumb{color:#91a7c6;font-size:13px;margin:10px 0 18px}.card,.section{border:1px solid var(--line);background:linear-gradient(150deg,#07172c,#041022);border-radius:20px;box-shadow:0 14px 45px #0003}.card{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.preview{min-height:360px;background:radial-gradient(circle at 60% 20%,#254e9c,transparent 60%),#08172d;border:1px solid #315174;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview img{width:100%;height:360px;object-fit:cover}.mock{width:78%;height:65%;background:#0b2341;border:1px solid #4c78a9;border-radius:10px;box-shadow:0 0 45px #126eff55}.badge{display:inline-block;background:#6d4cff;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:800}.category{color:#91a7c8;margin:16px 0 8px;font-size:13px}.title{font-size:42px;line-height:1.08;margin:0 0 18px;letter-spacing:-1.5px}.desc{color:#b4c7e3;line-height:1.8}.price{font-size:32px;color:#25a0ff;font-weight:900;margin:24px 0}.buy,.pay{display:block;text-align:center;color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;cursor:pointer;border:1px solid #2775ff;background:linear-gradient(135deg,#138fff,#2365ff);box-shadow:0 8px 22px #006eff30}.pay{margin-top:12px;background:#10152e;border-color:#8751ff}.features{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.feature{background:#102a4e;border:1px solid #315276;padding:8px 12px;border-radius:999px;color:#cbdcff;font-size:12px}.section{margin-top:22px;padding:24px}.section h2{margin:0 0 18px}.comment-form{display:grid;gap:10px}.comment-form select,.comment-form input,.comment-form textarea,.reply-form textarea{background:#0a1a31;color:white;border:1px solid #315276;border-radius:11px;padding:12px;outline:none}.comment-form button,.reply-form button{background:linear-gradient(135deg,#138fff,#2365ff);color:#fff;border:1px solid #2775ff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.comment{border-top:1px solid #294363;padding:16px 0}.comment strong{color:#8dbaff}.stars{color:#ffd45c;letter-spacing:2px;font-size:18px}.reply{margin:10px 0 0 18px;padding:10px 12px;border-left:3px solid #4d91ff;background:#0b1730;border-radius:8px}.reply-form{display:none;gap:8px;margin:10px 0 0 18px}.reply-form button{background:#315276;border-color:#315276;padding:8px 12px}.muted{color:#91a7c8}.download{display:none;background:#174f35;border:1px solid #3cc47a;padding:14px;border-radius:12px;margin-top:14px}.download a{color:#baffd5;font-weight:bold}@media(max-width:900px){.navlinks{display:none}.card{grid-template-columns:1fr}.title{font-size:32px}}@media(max-width:600px){.container{width:calc(100% - 20px)}.nav{padding:12px;gap:12px}.card{padding:12px}.section{padding:18px}.preview,.preview img{min-height:260px;height:260px}}
</style></head><body><div class="container"><nav class="nav"><div class="logo"><span>◢</span> Panel<i>Market</i></div><div class="navlinks"><a href="panelmarket.html">⌂ Anasayfa</a><a class="active" href="panelmarket.html#paneller">▦ Paneller</a><a href="panelmarket.html#paneller">▦ Kategoriler⌄</a><a href="panelmarket.html#fiyatlar">◉ Fiyatlar</a><a href="#">▥ Hakkımızda</a><a href="support.html">♧ Destek</a></div><div class="nav-actions"><button class="iconbtn" onclick="location.href='panelmarket.html'">⌕</button><button class="account" onclick="location.href='panelmarket.html'">♙ Hesabım⌄</button></div></nav><main class="page"><div class="crumb"><a href="panelmarket.html">Anasayfa</a>　/　Ürün Detayı</div><section class="card"><div class="preview" id="preview"></div><div><span class="badge" id="badge">Yeni</span><div class="category" id="category"></div><h1 class="title" id="name"></h1><p class="desc" id="description"></p><div class="features" id="features"></div><div class="price" id="price"></div><a class="buy" href="mailto:satis@panelmarket.com?subject=Ürün satın alma talebi">Satın Alma Talebi Gönder</a><a class="pay" id="paymentButton" href="payment.html">Ödeme Sayfasına Git →</a><div class="download" id="downloadBox">✓ Ödeme onayı alındı. <a id="downloadLink" download>Temayı hemen indir</a></div></div></section><section class="section"><h2>Ürün Yorumları</h2><form class="comment-form" id="commentForm"><input id="commentName" required placeholder="Adınız"><select id="commentRating" required><option value="">Yıldız puanı seçin</option><option value="1">★ 1 yıldız</option><option value="2">★★ 2 yıldız</option><option value="3">★★★ 3 yıldız</option><option value="4">★★★★ 4 yıldız</option><option value="5">★★★★★ 5 yıldız</option></select><textarea id="commentText" required rows="3" placeholder="Ürün hakkında yorumunuz..."></textarea><button type="submit">Yorum Ekle</button></form><div id="comments"><p class="muted">Henüz yorum yok.</p></div></section></main></div><script>
const p=new URLSearchParams(location.search),g=(k,d='')=>p.get(k)||d;const productId=g('id','unknown');
name.textContent=g('name','Ürün Detayı');category.textContent=g('tag',g('category'));description.textContent=g('description','Modern ve kullanıma hazır PanelMarket ürünü.');badge.textContent=g('badge','Yeni');price.textContent=Number(g('price','0')).toLocaleString('tr-TR')+' TL';
const featureItems=g('features','Modern Tasarım · Kolay Kurulum · Mobil Uyumlu').split(/[·,|]/).map(x=>x.trim()).filter(Boolean);features.innerHTML=featureItems.map(x=>`<span class="feature">✓ ${escapeHtml(x)}</span>`).join('');preview.innerHTML=g('image_url')?'<img src="'+escapeHtml(g('image_url'))+'">':'<div class="mock"></div>';
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const key='panelmarket-comments-'+productId;
function stars(n){return '★'.repeat(Number(n)||0)+'☆'.repeat(5-(Number(n)||0));}
function loadComments(){const list=JSON.parse(localStorage.getItem(key)||'[]');comments.innerHTML=list.length?list.map((c,i)=>`<div class="comment"><strong>${escapeHtml(c.name)}</strong><div class="stars" aria-label="${c.rating} yıldız">${stars(c.rating)}</div><div>${escapeHtml(c.text)}</div><small class="muted">${escapeHtml(c.date)}</small><button type="button" class="replyToggle" data-index="${i}" style="margin-top:10px;background:#172945;color:#fff;border:1px solid #315276;border-radius:8px;padding:8px 12px;cursor:pointer">Yanıtla (Satıcı)</button><div class="reply-form" id="reply-form-${i}"><textarea id="reply-text-${i}" rows="2" placeholder="Satıcı yanıtınızı yazın..."></textarea><button type="button" data-reply="${i}">Yanıtı Gönder</button></div>${c.reply?`<div class="reply"><strong>Satıcı</strong><div>${escapeHtml(c.reply)}</div><small class="muted">${escapeHtml(c.replyDate||'')}</small></div>`:''}</div>`).join(''):'<p class="muted">Henüz yorum yok.</p>';}
commentForm.addEventListener('submit',e=>{e.preventDefault();const list=JSON.parse(localStorage.getItem(key)||'[]');list.unshift({name:commentName.value.trim(),rating:Number(commentRating.value),text:commentText.value.trim(),date:new Date().toLocaleString('tr-TR')});localStorage.setItem(key,JSON.stringify(list));commentForm.reset();loadComments();});
comments.addEventListener('click',e=>{const toggle=e.target.closest('.replyToggle');if(toggle){const box=document.getElementById('reply-form-'+toggle.dataset.index);box.style.display=box.style.display==='grid'?'none':'grid';return;}const btn=e.target.closest('[data-reply]');if(btn){const i=Number(btn.dataset.reply);const text=document.getElementById('reply-text-'+i).value.trim();if(!text)return;const list=JSON.parse(localStorage.getItem(key)||'[]');list[i].reply=text;list[i].replyDate=new Date().toLocaleString('tr-TR');localStorage.setItem(key,JSON.stringify(list));loadComments();}});loadComments();
const paymentButton=document.querySelector('#paymentButton'); paymentButton.href='payment.html?'+new URLSearchParams({id:productId,name:g('name','Ürün'),price:g('price','0'),download_url:g('download_url','')}).toString();
</script></body></html>
