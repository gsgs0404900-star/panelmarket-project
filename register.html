<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt Ol - PanelMarket</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#020711;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    width:100%;
    max-width:430px;
    background:#071426;
    border:1px solid #162943;
    border-radius:20px;
    padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#91a1b8;
    font-size:14px;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dbe5f2;
    font-size:14px;
    font-weight:600;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:50px;
    border-radius:11px;
    border:1px solid #203653;
    background:#020b18;
    color:#fff;
    padding:0 15px;
    outline:none;
    font-size:15px;
    transition:.2s;
}

input:focus{
    border-color:#4c9fff;
    box-shadow:0 0 0 3px rgba(76,159,255,.10);
}

.password-input{
    padding-right:52px;
}

.show-password{
    position:absolute;
    right:0;
    top:0;
    height:50px;
    width:50px;
    border:0;
    background:none;
    color:#8fa3bc;
    cursor:pointer;
    font-size:18px;
}

.show-password:hover{
    color:#fff;
}

.register-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#3d96f5;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
    margin-top:4px;
}

.register-btn:hover{
    background:#3188e7;
}

.register-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login{
    text-align:center;
    margin-top:22px;
    color:#91a1b8;
    font-size:14px;
}

.login a{
    color:#65b0ff;
    font-weight:700;
}

.back{
    text-align:center;
    margin-top:22px;
}

.back a{
    color:#91a1b8;
    font-size:13px;
}

.back a:hover{
    color:#fff;
}

.message{
    display:none;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.4;
}

.message.error{
    display:block;
    background:#35151b;
    border:1px solid #71303a;
    color:#ffb5bd;
}

.message.success{
    display:block;
    background:#123421;
    border:1px solid #24663d;
    color:#a9efbf;
}

.loading{
    display:inline-flex;
    align-items:center;
    gap:8px;
}

.spinner{
    width:17px;
    height:17px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.info{
    color:#71859d;
    font-size:12px;
    line-height:1.5;
    margin-top:9px;
}

@media(max-width:480px){

    .container{
        padding:16px;
    }

    .card{
        padding:24px 20px;
        border-radius:16px;
    }

    .logo{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            PanelMarket
        </div>

        <div class="subtitle">
            Yeni hesabını oluştur
        </div>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <div class="form-group">

                <label for="fullName">
                    Ad Soyad
                </label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="Ad Soyad"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-posta
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="ornek@mail.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Şifre
                </label>

                <div class="input-wrap">

                    <input
                        id="password"
                        class="password-input"
                        type="password"
                        placeholder="En az 6 karakter"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Şifreyi göster"
                    >👁</button>

                </div>

                <div class="info">
                    Şifreniz en az 6 karakter olmalıdır.
                </div>

            </div>


            <div class="form-group">

                <label for="passwordConfirm">
                    Şifre Tekrar
                </label>

                <div class="input-wrap">

                    <input
                        id="passwordConfirm"
                        class="password-input"
                        type="password"
                        placeholder="Şifrenizi tekrar girin"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPasswordConfirm"
                        aria-label="Şifreyi göster"
                    >👁</button>

                </div>

            </div>


            <button
                type="submit"
                class="register-btn"
                id="registerButton"
            >
                Kayıt Ol
            </button>

        </form>


        <div class="login">

            Zaten hesabın var mı?

            <a href="login.html">
                Giriş Yap
            </a>

        </div>


        <div class="back">

            <a href="index.html">
                ← Ana Sayfaya Dön
            </a>

        </div>

    </div>

</div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    'https://gakvvqcsaoxhbuqvimqe.supabase.co';

const SUPABASE_ANON_KEY =
    'sb_publishable_74vcsqJXv7J_P-1hDwGQyg_WQBvIdty';


/* =========================================================
   ELEMENTLER
========================================================= */

const registerForm =
    document.getElementById('registerForm');

const fullNameInput =
    document.getElementById('fullName');

const emailInput =
    document.getElementById('email');

const passwordInput =
    document.getElementById('password');

const passwordConfirmInput =
    document.getElementById('passwordConfirm');

const registerButton =
    document.getElementById('registerButton');

const showPassword =
    document.getElementById('showPassword');

const showPasswordConfirm =
    document.getElementById(
        'showPasswordConfirm'
    );

const message =
    document.getElementById('message');


/* =========================================================
   MESAJ
========================================================= */

function showMessage(text, type = 'error') {

    message.textContent = text;

    message.className =
        'message ' + type;
}


function clearMessage() {

    message.textContent = '';

    message.className =
        'message';
}


/* =========================================================
   SUPABASE İSTEK
========================================================= */

async function supabaseRequest(path, options = {}) {

    const response = await fetch(
        SUPABASE_URL + path,
        {
            ...options,

            headers:{
                'apikey':
                    SUPABASE_ANON_KEY,

                'Authorization':
                    'Bearer ' +
                    SUPABASE_ANON_KEY,

                'Content-Type':
                    'application/json',

                ...(options.headers || {})
            }
        }
    );

    let data = null;

    try{

        data =
            await response.json();

    }catch{

        data = null;
    }

    if(!response.ok){

        const error =
            data?.msg ||
            data?.message ||
            data?.error_description ||
            data?.error ||
            'Bir hata oluştu.';

        throw new Error(error);
    }

    return data;
}


/* =========================================================
   OTURUM KAYDET
========================================================= */

function saveSession(data) {

    if(!data){
        return;
    }

    if(data.access_token){

        localStorage.setItem(
            'panelmarket_access_token',
            data.access_token
        );
    }

    if(data.refresh_token){

        localStorage.setItem(
            'panelmarket_refresh_token',
            data.refresh_token
        );
    }

    if(data.user){

        localStorage.setItem(
            'panelmarket_user',
            JSON.stringify(data.user)
        );
    }

    localStorage.setItem(
        'panelmarket_session',
        JSON.stringify(data)
    );
}


/* =========================================================
   KAYIT
========================================================= */

registerForm.addEventListener(
    'submit',
    async function(event){

        event.preventDefault();

        clearMessage();

        const fullName =
            fullNameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const passwordConfirm =
            passwordConfirmInput.value;


        /* -----------------------------------------
           KONTROLLER
        ----------------------------------------- */

        if(fullName.length < 2){

            showMessage(
                'Lütfen ad ve soyadınızı girin.'
            );

            fullNameInput.focus();

            return;
        }


        if(!email){

            showMessage(
                'Lütfen e-posta adresinizi girin.'
            );

            emailInput.focus();

            return;
        }


        if(password.length < 6){

            showMessage(
                'Şifre en az 6 karakter olmalıdır.'
            );

            passwordInput.focus();

            return;
        }


        if(password !== passwordConfirm){

            showMessage(
                'Şifreler aynı değil.'
            );

            passwordConfirmInput.focus();

            return;
        }


        /* -----------------------------------------
           BUTON
        ----------------------------------------- */

        registerButton.disabled = true;

        registerButton.innerHTML =
            '<span class="loading">' +
            '<span class="spinner"></span>' +
            'Kayıt oluşturuluyor...' +
            '</span>';


        try{

            const data =
                await supabaseRequest(
                    '/auth/v1/signup',
                    {
                        method:'POST',

                        body:JSON.stringify({

                            email:email,

                            password:password,

                            data:{
                                full_name:
                                    fullName,

                                name:
                                    fullName
                            }

                        })
                    }
                );


            /* -------------------------------------
               OTURUM VARSA
            ------------------------------------- */

            if(
                data &&
                data.access_token
            ){

                saveSession(data);

                showMessage(
                    'Kayıt başarılı. Yönlendiriliyorsunuz...',
                    'success'
                );

                setTimeout(
                    function(){

                        window.location.href =
                            'index.html';

                    },
                    700
                );

                return;
            }


            /* -------------------------------------
               E-POSTA DOĞRULAMASI GEREKİYORSA
            ------------------------------------- */

            showMessage(
                'Kayıt başarılı! E-posta adresinize gönderilen doğrulama bağlantısını onayladıktan sonra giriş yapabilirsiniz.',
                'success'
            );

            registerButton.disabled =
                false;

            registerButton.textContent =
                'Kayıt Ol';


        }catch(error){

            console.error(
                'Kayıt hatası:',
                error
            );

            let errorText =
                error.message ||
                'Kayıt oluşturulamadı.';


            if(
                errorText
                    .toLowerCase()
                    .includes(
                        'already registered'
                    )
            ){

                errorText =
                    'Bu e-posta adresi zaten kayıtlı.';

            }


            if(
                errorText
                    .toLowerCase()
                    .includes(
                        'user already registered'
                    )
            ){

                errorText =
                    'Bu e-posta adresi zaten kayıtlı.';

            }


            if(
                errorText
                    .toLowerCase()
                    .includes(
                        'password should be at least'
                    )
            ){

                errorText =
                    'Şifre en az 6 karakter olmalıdır.';

            }


            showMessage(errorText);

            registerButton.disabled =
                false;

            registerButton.textContent =
                'Kayıt Ol';
        }

    }
);


/* =========================================================
   ŞİFRE GÖSTER / GİZLE
========================================================= */

showPassword.addEventListener(
    'click',
    function(){

        if(
            passwordInput.type ===
            'password'
        ){

            passwordInput.type =
                'text';

            showPassword.textContent =
                '🙈';

        }else{

            passwordInput.type =
                'password';

            showPassword.textContent =
                '👁';
        }

    }
);


/* =========================================================
   ŞİFRE TEKRAR GÖSTER / GİZLE
========================================================= */

showPasswordConfirm.addEventListener(
    'click',
    function(){

        if(
            passwordConfirmInput.type ===
            'password'
        ){

            passwordConfirmInput.type =
                'text';

            showPasswordConfirm.textContent =
                '🙈';

        }else{

            passwordConfirmInput.type =
                'password';

            showPasswordConfirm.textContent =
                '👁';
        }

    }
);


/* =========================================================
   ŞİFRELERİ ANLIK KONTROL
========================================================= */

passwordConfirmInput.addEventListener(
    'input',
    function(){

        if(
            passwordConfirmInput.value &&
            passwordInput.value !==
                passwordConfirmInput.value
        ){

            passwordConfirmInput.setCustomValidity(
                'Şifreler aynı değil.'
            );

        }else{

            passwordConfirmInput.setCustomValidity(
                ''
            );
        }

    }
);


/* =========================================================
   ZATEN GİRİŞ YAPILMIŞSA
========================================================= */

(function(){

    const token =
        localStorage.getItem(
            'panelmarket_access_token'
        );

    if(token){

        window.location.href =
            'index.html';
    }

})();
</script>

</body>
</html>
